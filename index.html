<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roboticks Lab 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17221d; --muted:#738079; --lime:#c8ef45; --green:#1f503e; --cream:#f4f3ed; --panel:#fff; --line:#dfe3dc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Manrope,sans-serif; color:var(--ink); background:var(--cream); overflow:hidden; }
    button { font:inherit; }
    .app { display:grid; grid-template-rows:72px 1fr; height:100vh; }
    header { display:flex; align-items:center; gap:18px; padding:0 26px; background:#fff; border-bottom:1px solid var(--line); z-index:20; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.4px; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; background:var(--ink); color:var(--lime); }
    .brand-mark svg { width:23px; }
    nav { display:flex; gap:4px; margin-left:18px; }
    nav button { border:0; background:transparent; color:#6d776f; padding:10px 13px; border-radius:8px; cursor:pointer; }
    nav button.active { color:var(--ink); background:#edf0e9; font-weight:700; }
    .header-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .icon-btn,.primary-btn { height:40px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    .icon-btn { width:40px; display:grid; place-items:center; }
    .primary-btn { border:0; background:var(--lime); color:var(--ink); font-weight:800; padding:0 16px; }
    .workspace { display:grid; grid-template-columns:235px minmax(400px,1fr) 248px; min-height:0; }
    aside { background:#fff; border-right:1px solid var(--line); padding:18px 14px; overflow:auto; }
    aside.right { border-right:0; border-left:1px solid var(--line); }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:2px 6px 10px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.9px; color:#7b867f; }
    .board-list { display:flex; flex-direction:column; gap:7px; }
    .board-card { width:100%; display:flex; align-items:center; gap:10px; border:1px solid transparent; background:transparent; border-radius:10px; padding:8px; text-align:left; cursor:pointer; color:var(--ink); }
    .board-card:hover { background:#f5f6f2; }
    .board-card.active { border-color:#bfc8bc; background:#f1f4ed; }
    .thumb { width:54px; height:42px; border-radius:7px; display:grid; place-items:center; background:#dcebcf; font-size:9px; font-family:'DM Mono'; font-weight:600; }
    .thumb.pi { background:#d8ef9d; }.thumb.sensor { background:#dbe4e8; }.thumb.motor { background:#ead8c2; }
    .board-card strong { display:block; font-size:12px; }.board-card small { display:block; margin-top:3px; color:#929b95; font-size:10px; }
    .divider { height:1px; background:#edf0ea; margin:15px 5px; }
    .stage { position:relative; min-width:0; overflow:hidden; background:linear-gradient(180deg,#edf1e9 0%,#dfe5dc 100%); }
    .stage::before { content:""; position:absolute; inset:50% -20% -40%; background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(90,108,96,.08) 39px 40px),repeating-linear-gradient(0deg,transparent 0 38px,rgba(90,108,96,.08) 39px 40px); transform:perspective(700px) rotateX(58deg); transform-origin:center top; }
    .canvas-tools { position:absolute; left:18px; top:18px; z-index:5; display:flex; gap:7px; }
    .tool { height:38px; min-width:38px; padding:0 11px; border:1px solid rgba(31,80,62,.12); border-radius:9px; background:rgba(255,255,255,.92); box-shadow:0 4px 16px rgba(43,65,53,.06); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:12px; font-weight:700; }
    .tool.active { background:var(--ink); color:#fff; }
    .scene { position:absolute; inset:90px 30px 110px; display:flex; align-items:center; justify-content:center; perspective:900px; }
    .board-3d { position:relative; width:min(520px,75%); aspect-ratio:1.68; border-radius:15px; background:#176c50; box-shadow:0 32px 45px rgba(30,56,43,.25),0 12px 0 #0f4b38,0 15px 18px rgba(23,45,34,.18); transform:rotateX(16deg) rotateZ(-2deg); transition:.55s cubic-gradient; border:2px solid #2a8464; }
    .board-3d.pi-board { background:#65a849; }.board-3d.sensor-board { background:#24758d; }.board-3d.motor-board { background:#d39a45; }
    .board-3d.disassembled { transform:rotateX(22deg) rotateZ(-2deg) scale(.94); }
    .board-name { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:rgba(255,255,255,.9); font-size:18px; font-weight:800; letter-spacing:1px; }
    .chip { position:absolute; width:25%; height:42%; left:43%; top:29%; border-radius:5px; background:#26302c; box-shadow:0 5px 0 #111712,0 8px 12px rgba(0,0,0,.25); }
    .chip::after { content:"ATmega328P"; position:absolute; inset:0; display:grid; place-items:center; color:#d6ddd8; font-size:10px; font-family:'DM Mono'; }
    .pi-board .chip::after { content:"Cortex A72" }.sensor-board .chip::after { content:"SENSOR" }.motor-board .chip::after { content:"MOTOR IC" }
    .usb { position:absolute; width:12%; height:14%; left:-1%; top:33%; background:#d1d3cb; border:5px solid #afb3aa; border-radius:3px; }
    .pins { position:absolute; right:-2px; top:15%; width:6%; height:68%; background:repeating-linear-gradient(0deg,#f2bd57 0 5px,#292e2b 5px 9px); border-radius:3px; }
    .header-pins { position:absolute; left:30%; bottom:-5%; width:38%; height:7%; background:repeating-linear-gradient(90deg,#e6aa38 0 4px,#202724 4px 8px); }
    .hole { position:absolute; width:9px; height:9px; border-radius:50%; background:#c0d6c7; border:2px solid #24583f; }
    .h1{left:4%;top:5%}.h2{right:4%;top:5%}.h3{left:4%;bottom:5%}.h4{right:4%;bottom:5%}
    .led { position:absolute; width:12px; height:12px; border-radius:50%; right:17%; top:18%; background:#ff6d55; box-shadow:0 0 14px #ff6d55; }
    .led.on { animation:pulse 1s infinite alternate; } @keyframes pulse { to { box-shadow:0 0 25px #ffb45e;background:#ffd37a } }
    .component { position:absolute; transition:.5s; }.disassembled .chip { transform:translate(-55px,-30px) rotate(-8deg); }.disassembled .usb { transform:translate(-35px,20px) rotate(-4deg); }.disassembled .pins { transform:translate(28px,12px) rotate(5deg); }.disassembled .led { transform:translate(40px,-25px); }
    .bottom-bar { position:absolute; z-index:8; left:50%; bottom:22px; transform:translateX(-50%); display:flex; align-items:center; gap:5px; padding:6px; border-radius:12px; background:rgba(255,255,255,.94); box-shadow:0 8px 24px rgba(42,65,53,.12); }
    .bottom-bar button { width:38px; height:38px; border:0; border-radius:8px; background:transparent; cursor:pointer; }.bottom-bar button.active { background:#edf1e8; }
    .bottom-bar .zoom { width:58px; font-size:11px; font-family:'DM Mono'; }
    .property { padding:0 5px; }.property h3 { margin:4px 0 13px; font-size:14px; }.property label { display:flex; justify-content:space-between; align-items:center; margin:9px 0; color:#738079; font-size:11px; }
    .property input { width:106px; border:1px solid var(--line); background:#f8f9f6; border-radius:7px; height:32px; padding:0 8px; font-family:'DM Mono'; color:var(--ink); }
    .color-row { display:flex; gap:6px; }.swatch { width:25px; height:25px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px #ccd3ca; cursor:pointer; }.swatch.selected { box-shadow:0 0 0 2px var(--ink); }
    .status { border:1px solid #dde5d8; border-radius:9px; padding:10px; background:#f7f9f4; font-size:11px; }.status-row { display:flex; justify-content:space-between; margin:7px 0; }.online { color:#3c8b5c; font-weight:800; }
    .wire-layer { position:absolute; inset:0; pointer-events:none; z-index:6; } .wire-layer path { fill:none; stroke-width:5; stroke-linecap:round; filter:drop-shadow(0 3px 2px rgba(0,0,0,.15)); }
    @media(max-width:900px){ .workspace{grid-template-columns:190px minmax(300px,1fr)} aside.right{display:none}.board-3d{width:78%} }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark">R</div> <span>Roboticks <b>Lab</b></span></div>
    <nav><button class="active">Workbench</button><button>Projects</button><button>Components</button></nav>
    <div class="header-actions"><button class="icon-btn" title="Save">⌑</button><button class="icon-btn" title="Settings">⚙</button><button class="primary-btn" id="runBtn">▶ Run simulation</button></div>
  </header>
  <main class="workspace">
    <aside>
      <div class="section-title"><span>Devices</span><span>＋</span></div>
      <div class="board-list">
        <button class="board-card active" data-board="uno"><div class="thumb">UNO</div><span><strong>Arduino Uno</strong><small>Microcontroller</small></span></button>
        <button class="board-card" data-board="pi"><div class="thumb pi">Pi 4</div><span><strong>Raspberry Pi 4</strong><small>Single-board computer</small></span></button>
        <button class="board-card" data-board="sensor"><div class="thumb sensor">TEMP</div><span><strong>Temp Sensor</strong><small>Analog module</small></span></button>
        <button class="board-card" data-board="motor"><div class="thumb motor">MTR</div><span><strong>Motor Driver</strong><small>DC motor controller</small></span></button>
      </div>
      <div class="divider"></div>
      <div class="section-title"><span>Components</span><span>＋</span></div>
      <div class="board-list">
        <button class="board-card" data-board="sensor"><div class="thumb sensor">◉</div><span><strong>LED</strong><small>Output</small></span></button>
        <button class="board-card" data-board="motor"><div class="thumb motor">◎</div><span><strong>Servo Motor</strong><small>Actuator</small></span></button>
        <button class="board-card"><div class="thumb">≋</div><span><strong>Jumper Wire</strong><small>Connection</small></span></button>
      </div>
    </aside>
    <section class="stage">
      <div class="canvas-tools"><button class="tool active" id="selectTool">⌖ Select</button><button class="tool" id="wireTool">〰 Wire</button><button class="tool" id="measureTool">⌁ Measure</button></div>
      <div class="scene">
        <svg class="wire-layer" viewBox="0 0 700 400"><path id="wire" d="M88 245 C170 330 500 330 605 210" stroke="#d96d54" style="opacity:0"/></svg>
        <div class="board-3d" id="board">
          <span class="hole h1"></span><span class="hole h2"></span><span class="hole h3"></span><span class="hole h4"></span>
          <div class="usb component"></div><div class="chip component"></div><div class="pins component"></div><div class="header-pins component"></div><div class="led component" id="led"></div>
          <div class="board-name">ROBOTICKS LAB</div>
        </div>
      </div>
      <div class="bottom-bar"><button class="active">⌖</button><button id="disassemble">⛶</button><button id="resetView">↻</button><button>⊕</button><button class="zoom">100%</button></div>
    </section>
    <aside class="right">
      <div class="property">
        <h3 id="propertyName">Arduino Uno</h3>
        <label>Voltage <input value="5 V"></label>
        <label>Clock <input value="16 MHz"></label>
        <label>Pin count <input value="14 I/O"></label>
        <div class="divider"></div>
        <div class="section-title" style="margin-left:0"><span>PCB color</span></div>
        <div class="color-row"><button class="swatch selected" style="background:#176c50" data-color="uno"></button><button class="swatch" style="background:#65a849" data-color="pi"></button><button class="swatch" style="background:#24758d" data-color="sensor"></button><button class="swatch" style="background:#d39a45" data-color="motor"></button></div>
        <div class="divider"></div>
        <div class="section-title" style="margin-left:0"><span>Status</span></div>
        <div class="status"><div class="status-row"><span>Connection</span><span class="online">● Online</span></div><div class="status-row"><span>Power</span><span id="power">0.00 W</span></div><div class="status-row"><span>Temperature</span><span id="temp">24°C</span></div></div>
      </div>
    </aside>
  </main>
</div>
<script>
const board=document.getElementById('board'), led=document.getElementById('led'), wire=document.getElementById('wire');
const names={uno:'Arduino Uno',pi:'Raspberry Pi 4',sensor:'Temperature Sensor',motor:'Motor Driver'};
let running=false;
document.querySelectorAll('.board-card[data-board]').forEach(card=>card.addEventListener('click',()=>{
  document.querySelectorAll('.board-card').forEach(c=>c.classList.remove('active')); card.classList.add('active');
  const type=card.dataset.board; board.className='board-3d '+(type==='uno'?'':' '+type+'-board'); document.getElementById('propertyName').textContent=names[type];
}));
document.querySelectorAll('.tool').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));t.classList.add('active');wire.style.opacity=t.id==='wireTool'?'.85':'0';}));
document.getElementById('disassemble').addEventListener('click',()=>board.classList.toggle('disassembled'));
document.getElementById('resetView').addEventListener('click',()=>board.classList.remove('disassembled'));
document.getElementById('runBtn').addEventListener('click',e=>{running=!running;led.classList.toggle('on',running);wire.style.opacity=running?'1':'0';e.currentTarget.textContent=running?'■ Stop simulation':'▶ Run simulation';document.getElementById('power').textContent=running?'1.24 W':'0.00 W';document.getElementById('temp').textContent=running?'31°C':'24°C';});
document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));s.classList.add('selected');board.className='board-3d '+(s.dataset.color==='uno'?'':s.dataset.color+'-board');}));
</script>
</body>
</html>
