<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Lab 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171a18;--muted:#738078;--line:#e1e5de;--lime:#c4ee55;--canvas:#edf1e8}*{box-sizing:border-box}body{margin:0;height:100vh;font-family:Manrope,sans-serif;color:var(--ink);overflow:hidden;background:#f7f8f5}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:68px 1fr}.top{display:flex;align-items:center;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:16px}.nav{display:flex;margin-left:38px;height:100%;align-items:center;gap:4px}.nav button{border:0;background:none;height:40px;padding:0 13px;border-radius:8px;color:#737d76;font-weight:700}.nav button.active{background:#edf1e9;color:var(--ink)}.actions{margin-left:auto;display:flex;gap:8px}.icon,.run{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff}.icon{width:40px}.run{border:0;padding:0 16px;background:var(--lime);font-weight:800}.workspace{display:grid;grid-template-columns:220px minmax(390px,1fr) 252px;min-height:0}.side{background:#fff;border-right:1px solid var(--line);padding:17px 12px;overflow:auto}.side.right{border-right:0;border-left:1px solid var(--line)}.head{display:flex;justify-content:space-between;margin:3px 7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:#879087;font-weight:800}.cards{display:flex;flex-direction:column;gap:5px}.card{height:58px;width:100%;display:flex;align-items:center;gap:9px;border:1px solid transparent;border-radius:9px;background:none;color:var(--ink);text-align:left;padding:7px;cursor:pointer}.card:hover{background:#f5f7f2}.card.active{border-color:#ccd4c8;background:#eff3ec}.thumb{width:46px;height:42px;border-radius:7px;display:grid;place-items:center;font:700 9px 'DM Mono';background:#dce9cf}.thumb.blue{background:#cedee4}.thumb.orange{background:#ead7bd}.thumb.pi{background:#b7dca1}.copy strong{display:block;font-size:11px}.copy small{display:block;margin-top:3px;color:#929a94;font-size:9px}.divider{height:1px;background:#edf0ea;margin:14px 6px}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 46%,#fafbf8 0,#edf1e8 42%,#dde5d7 100%)}.stage:after{content:"";position:absolute;left:-15%;right:-15%;bottom:-25%;height:54%;background-image:linear-gradient(rgba(73,96,78,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(73,96,78,.08) 1px,transparent 1px);background-size:42px 42px;transform:perspective(600px) rotateX(58deg);transform-origin:bottom}.tools{position:absolute;z-index:10;left:16px;top:16px;display:flex;gap:6px}.tool{height:38px;border:1px solid rgba(25,55,39,.09);border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 5px 18px rgba(56,78,63,.08);padding:0 11px;cursor:pointer}.tool.active{background:var(--ink);color:#fff}.scene{position:absolute;z-index:3;inset:80px 25px 92px;display:grid;place-items:center;perspective:1000px}.board{--pcb:#087f52;position:relative;width:min(500px,74%);aspect-ratio:1.68;border-radius:13px;background:linear-gradient(145deg,#16845d,var(--pcb));box-shadow:0 24px 28px rgba(35,62,45,.24),0 10px 0 #07583b,0 13px 18px rgba(28,55,39,.16);transform:rotateX(12deg) rotateZ(-2deg);transition:.65s cubic-bezier(.2,.8,.2,1);border:2px solid rgba(255,255,255,.12)}.board:before{content:"";position:absolute;inset:10px;border-radius:7px;border:1px solid rgba(255,255,255,.09);background:radial-gradient(circle at 10% 15%,#c6a744 0 3px,transparent 4px),radial-gradient(circle at 90% 15%,#c6a744 0 3px,transparent 4px),radial-gradient(circle at 10% 85%,#c6a744 0 3px,transparent 4px),radial-gradient(circle at 90% 85%,#c6a744 0 3px,transparent 4px)}.board.pi{--pcb:#58a02d}.board.esp{--pcb:#3c7194}.board.nano{--pcb:#7d5aa7}.chip{position:absolute;z-index:4;width:25%;height:38%;left:43%;top:31%;border-radius:4px;background:linear-gradient(145deg,#282d29,#111410);box-shadow:0 6px 0 #080a09,0 9px 15px rgba(0,0,0,.28);display:grid;place-items:center}.chip span{color:#dfe3df;font:600 9px 'DM Mono';text-align:center}.usb{position:absolute;z-index:5;width:13%;height:13%;left:-1%;top:34%;border-radius:3px;background:linear-gradient(90deg,#bec2ba 0 12%,#e2e3dc 12% 88%,#9da39b 88%)}.usb:after{content:"";position:absolute;left:28%;top:-7%;width:45%;height:45%;border:3px solid #8d948d}.pins{position:absolute;z-index:5;right:-1%;top:17%;width:5%;height:66%;background:repeating-linear-gradient(0deg,#efbd55 0 4px,#26302b 4px 8px);border-radius:2px}.headerpins{position:absolute;z-index:5;left:29%;bottom:-1%;width:39%;height:5%;background:repeating-linear-gradient(90deg,#efbd55 0 4px,#26302b 4px 8px)}.led{position:absolute;z-index:6;width:11px;height:11px;right:15%;top:16%;border-radius:50%;background:#ff795d;box-shadow:0 0 10px #ff795d}.led.on{background:#adf34e;box-shadow:0 0 18px #c9ff62}.capacitor{position:absolute;z-index:5;width:18px;height:32px;left:22%;top:22%;border-radius:50%;background:linear-gradient(90deg,#29322e,#6b776f,#1e2622)}.cap2{left:28%;top:60%}.trace{position:absolute;z-index:2;height:2px;width:28%;background:rgba(205,226,180,.42);left:12%;top:48%;transform:rotate(8deg);box-shadow:0 14px rgba(205,226,180,.35),0 28px rgba(205,226,180,.25)}.part{transition:.55s}.board.disassemble .chip{transform:translate(-65px,-32px) rotate(-8deg)}.board.disassemble .usb{transform:translate(-42px,23px) rotate(-5deg)}.board.disassemble .pins{transform:translate(35px,15px) rotate(6deg)}.board.disassemble .led{transform:translate(40px,-32px)}.board.disassemble .capacitor{transform:translate(-25px,35px)}.name{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font:800 13px 'DM Mono';letter-spacing:2px;color:rgba(255,255,255,.22)}.wires{position:absolute;z-index:7;inset:0;pointer-events:none}.wires path{fill:none;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));opacity:0;transition:.3s}.wires path.show{opacity:1}.bottom{position:absolute;z-index:12;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 8px 24px rgba(42,65,53,.12)}.bottom button{width:38px;height:38px;border:0;border-radius:8px;background:none;cursor:pointer}.bottom button.active{background:#edf1e8}.property h3{margin:3px 5px 14px;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:10px;color:var(--muted)}.row input{width:108px;height:31px;border:1px solid var(--line);border-radius:7px;background:#f8f9f6;padding:0 8px;color:var(--ink);font:10px 'DM Mono'}.colors{display:flex;gap:7px}.color{width:26px;height:26px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ccd3ca;cursor:pointer}.color.active{box-shadow:0 0 0 2px var(--ink)}.status{border:1px solid #dde5d8;border-radius:9px;padding:9px;background:#f7f9f4;font-size:10px}.status .row{margin:5px}.online{color:#3c985d;font-weight:800}.hiddenmobile{display:block}@media(max-width:900px){.workspace{grid-template-columns:174px 1fr}.side.right{display:none}.board{width:82%}.nav{margin-left:12px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">R</div><span>Robotics <b>Lab</b></span></div><nav class="nav"><button class="active">Workbench</button><button>Projects</button><button>Components</button></nav><div class="actions"><button class="icon" id="save" title="Save">⌑</button><button class="icon" title="Settings">⚙</button><button class="run" id="run">▶ Run simulation</button></div></header>
<main class="workspace"><aside class="side"><div class="head"><span>Devices</span><span>＋</span></div><div class="cards">
<button class="card active" data-type="uno" data-name="Arduino Uno R3" data-chip="ATmega328P"><div class="thumb">UNO</div><div class="copy"><strong>Arduino Uno R3</strong><small>Microcontroller</small></div></button>
<button class="card" data-type="pi" data-name="Raspberry Pi 4" data-chip="Cortex A72"><div class="thumb pi">PI 4</div><div class="copy"><strong>Raspberry Pi 4</strong><small>Single-board computer</small></div></button>
<button class="card" data-type="esp" data-name="ESP32 DevKit" data-chip="ESP32"><div class="thumb blue">ESP</div><div class="copy"><strong>ESP32 DevKit</strong><small>IoT controller</small></div></button>
<button class="card" data-type="nano" data-name="Arduino Nano" data-chip="ATmega328P"><div class="thumb orange">NANO</div><div class="copy"><strong>Arduino Nano</strong><small>Compact board</small></div></button></div><div class="divider"></div><div class="head"><span>Components</span><span>＋</span></div><div class="cards">
<button class="card" data-component="led"><div class="thumb orange">LED</div><div class="copy"><strong>RGB LED</strong><small>Output</small></div></button><button class="card" data-component="servo"><div class="thumb blue">SERVO</div><div class="copy"><strong>Servo Motor</strong><small>Actuator</small></div></button><button class="card" data-component="wire"><div class="thumb">WIRE</div><div class="copy"><strong>Jumper Wire</strong><small>Connection</small></div></button></div></aside>
<section class="stage"><div class="tools"><button class="tool active" data-tool="select">⌖ Select</button><button class="tool" data-tool="wire">〰 Wire</button><button class="tool" data-tool="measure">⌁ Measure</button></div><div class="scene"><svg class="wires" viewBox="0 0 700 400"><path id="red" d="M95 235 C180 320 510 320 610 205" stroke="#e05d45"/><path id="blue" d="M100 210 C210 100 500 105 620 240" stroke="#4a86bf"/></svg><div class="board" id="board"><div class="trace"></div><div class="usb part"></div><div class="chip part"><span id="chipText">ATmega328P</span></div><div class="pins part"></div><div class="headerpins part"></div><div class="led part" id="led"></div><div class="capacitor part"></div><div class="capacitor cap2 part"></div><div class="name">ROBOTICS LAB</div></div></div><div class="bottom"><button class="active">⌖</button><button id="disassemble">⛶</button><button id="reset">↻</button><button id="zoomOut">−</button><button id="zoomLabel">100%</button><button id="zoomIn">＋</button></div></section>
<aside class="side right"><div class="property"><h3 id="propName">Arduino Uno R3</h3><div class="row"><span>Operating voltage</span><input id="voltage" value="5 V"></div><div class="row"><span>Clock frequency</span><input id="clock" value="16 MHz"></div><div class="row"><span>Digital pins</span><input id="pins" value="14"></div><div class="divider"></div><div class="head" style="margin-left:0"><span>PCB color</span></div><div class="colors"><button class="color active" style="background:#087f52" data-cl="uno"></button><button class="color" style="background:#58a02d" data-cl="pi"></button><button class="color" style="background:#3c7194" data-cl="esp"></button><button class="color" style="background:#7d5aa7" data-cl="nano"></button></div><div class="divider"></div><div class="head" style="margin-left:0"><span>Live status</span></div><div class="status"><div class="row"><span>Connection</span><span class="online">● Online</span></div><div class="row"><span>Power draw</span><span id="power">0.00 W</span></div><div class="row"><span>Temperature</span><span id="temp">24°C</span></div></div></div></aside></main></div>
<script>
const board=document.querySelector('#board'),led=document.querySelector('#led'),red=document.querySelector('#red'),blue=document.querySelector('#blue'),run=document.querySelector('#run');let running=false,zoom=100;
function selectBoard(c){document.querySelectorAll('.card[data-type]').forEach(x=>x.classList.remove('active'));c.classList.add('active');const t=c.dataset.type;board.className='board'+(t==='uno'?'' :' '+t);document.querySelector('#propName').textContent=c.dataset.name;document.querySelector('#chipText').textContent=c.dataset.chip;const data={uno:['5 V','16 MHz','14'],pi:['5 V','1.8 GHz','40'],esp:['3.3 V','240 MHz','30'],nano:['5 V','16 MHz','14']};['voltage','clock','pins'].forEach((id,i)=>document.querySelector('#'+id).value=data[t][i]+(id==='pins'?'':id==='clock'?'': ''));}
document.querySelectorAll('.card[data-type]').forEach(c=>c.onclick=()=>selectBoard(c));document.querySelectorAll('.tool').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));t.classList.add('active');red.classList.toggle('show',t.dataset.tool==='wire');blue.classList.toggle('show',t.dataset.tool==='wire')});document.querySelector('#disassemble').onclick=()=>board.classList.toggle('disassemble');document.querySelector('#reset').onclick=()=>{board.classList.remove('disassemble');zoom=100;board.style.scale='1';document.querySelector('#zoomLabel').textContent='100%'};document.querySelector('#zoomIn').onclick=()=>setZoom(Math.min(180,zoom+10));document.querySelector('#zoomOut').onclick=()=>setZoom(Math.max(60,zoom-10));function setZoom(v){zoom=v;board.style.scale=v/100;document.querySelector('#zoomLabel').textContent=v+'%'}run.onclick=()=>{running=!running;led.classList.toggle('on',running);red.classList.toggle('show',running);blue.classList.toggle('show',running);run.textContent=running?'■ Stop simulation':'▶ Run simulation';document.querySelector('#power').textContent=running?'1.24 W':'0.00 W';document.querySelector('#temp').textContent=running?'31°C':'24°C'};document.querySelectorAll('.color').forEach(c=>c.onclick=()=>{document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));c.classList.add('active');board.className='board '+(c.dataset.cl==='uno'?'':c.dataset.cl)});document.querySelector('#save').onclick=e=>{e.currentTarget.textContent='✓';setTimeout(()=>e.currentTarget.textContent='⌑',900)};
</script></body></html>
